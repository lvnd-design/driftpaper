<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Driftpaper background example</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, sans-serif;
      }
      #driftpaper-bg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
      }
      main {
        display: grid;
        place-items: center;
        min-height: 100vh;
        color: #111;
      }
      h1 {
        padding: 24px 32px;
        border-radius: 16px;
        background: rgb(255 255 255 / 0.8);
      }
    </style>
  </head>
  <body>
    <canvas id="driftpaper-bg"></canvas>
    <main><h1>Content sits on top of the background</h1></main>

    <!--
      In another app, swap these relative paths for the jsDelivr URLs:
      https://cdn.jsdelivr.net/gh/lvnd-design/driftpaper@main/embed/stipple-background.js
      https://cdn.jsdelivr.net/gh/lvnd-design/driftpaper@main/presets/hard-pigment.json
    -->
    <script type="module">
      import { fetchStippleSnapshot, mountStippleBackground } from "../embed/stipple-background.js";

      const snapshot = await fetchStippleSnapshot("../presets/hard-pigment.json");
      mountStippleBackground(document.getElementById("driftpaper-bg"), snapshot);
    </script>
  </body>
</html>
